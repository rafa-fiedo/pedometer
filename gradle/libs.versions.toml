[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.14"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
room = "2.8.5"
